name: Sinyal Botu

on:
  schedule:
    # Her 15 dakikada bir, mum kapandıktan 2 dakika sonra.
    # 15m her seferinde, 1h sadece saat başı mum kapandığında taranır.
    # GitHub bazen birkaç dakika gecikmeyle çalıştırır.
    - cron: "4,19,34,49 * * * *"   # yedek; asıl tetikleyici cron-job.org
  workflow_dispatch:   # cron-job.org ve "Run workflow" butonu bunu kullanır
    inputs:
      test:
        description: "Test mesajı gönder (trend listesi)"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Daha önce gönderilen sinyallerin listesini geri yükle
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: signal-state-${{ github.run_id }}
          restore-keys: signal-state-

      - name: Tara
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_RUN: ${{ inputs.test == true }}
          TIMEFRAMES: "15m, 1h"
          SYMBOLS: "BTC_USDT, ETH_USDT, SOL_USDT, XRP_USDT, BNB_USDT, DOGE_USDT, ADA_USDT, AVAX_USDT, LINK_USDT, DOT_USDT, LTC_USDT, TRX_USDT, SUI_USDT, NEAR_USDT, APT_USDT, ARB_USDT, OP_USDT, ATOM_USDT, PEPE_USDT, SHIB_USDT"
        run: python signal_bot.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: signal-state-${{ github.run_id }}
